name: Release Melo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ELECTRON_MIRROR: https://github.com/castlabs/electron-releases/releases/download/
      ELECTRON_CUSTOM_DIR: v30.3.1+wvcus
      npm_config_electron_mirror: https://github.com/castlabs/electron-releases/releases/download/
      npm_config_electron_custom_dir: v30.3.1+wvcus

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-30.3.1+wvcus
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Installing with castLabs mirror (v30.3.1+wvcus)..."
          export ELECTRON_MIRROR=https://github.com/castlabs/electron-releases/releases/download/
          export ELECTRON_CUSTOM_DIR=v30.3.1+wvcus
          npm install --verbose || {
            echo "castLabs install failed, retrying with official Electron"
            rm -rf node_modules package-lock.json
            npm install
          }

      - name: Syntax check
        run: npm run test:syntax

      - name: Build and release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
          ELECTRON_MIRROR: https://github.com/castlabs/electron-releases/releases/download/
          ELECTRON_CUSTOM_DIR: v30.3.1+wvcus
        shell: bash
        run: |
          set -euo pipefail
          echo "Building with castLabs Electron (v30.3.1+wvcus with Widevine)..."
          export ELECTRON_MIRROR=https://github.com/castlabs/electron-releases/releases/download/
          export ELECTRON_CUSTOM_DIR=v30.3.1+wvcus
          npm run release:publish
