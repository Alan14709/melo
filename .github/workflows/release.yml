name: Release Melo

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      ELECTRON_MIRROR: https://github.com/castlabs/electron-releases/releases/download/v

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Cache Electron binaries
        uses: actions/cache@v4
        with:
          path: ~/.cache/electron
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-electron-

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          echo "Installing with castLabs mirror..."
          if npm install; then
            echo "castLabs install OK"
          else
            echo "castLabs install failed, retrying with official Electron fallback"
            rm -rf node_modules
            npm pkg set devDependencies.electron='^30.3.1'
            ELECTRON_MIRROR=https://github.com/electron/electron/releases/download/ npm install
          fi

      - name: Syntax check
        run: npm run test:syntax

      - name: Build and release
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: false
        shell: bash
        run: |
          set -euo pipefail
          echo "Building with castLabs Electron..."
          if npm run release:publish; then
            echo "castLabs build OK"
          else
            echo "castLabs build failed, retrying with official Electron fallback"
            rm -rf node_modules
            npm pkg set devDependencies.electron='^30.3.1'
            ELECTRON_MIRROR=https://github.com/electron/electron/releases/download/ npm install
            ELECTRON_MIRROR=https://github.com/electron/electron/releases/download/ npm run release:publish
          fi
